[config]
reload_apps = false
set_wallpaper = false

[templates.quickshell]
input_path = "~/.config/quickshell/config/matugen/templates/quickshell-colors.json"
output_path = "~/.cache/matugen/colors.json"

[templates.hyprlock]
input_path = "~/.config/quickshell/config/matugen/templates/hyprlock-colors.conf"
output_path = "~/.config/hypr/config/lock-colors.conf"

[templates.kitty]
input_path = "~/.config/quickshell/config/matugen/templates/kitty-colors.conf"
output_path = "~/.config/quickshell/generated/kitty-colors.conf"
post_hook = 'pkill -USR1 -u "$(id -u)" -x kitty || true'
