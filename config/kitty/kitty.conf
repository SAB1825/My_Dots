# ~/.config/kitty/kitty.conf
# Font -----------------------------------------------------------------------
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12

# Window ---------------------------------------------------------------------
background_opacity 0.92
# Blur is provided by Niri via DarkShadow's Shell.

hide_window_decorations yes
window_padding_width    20
confirm_os_window_close 0

# Behaviour ------------------------------------------------------------------
scrollback_lines     10000
mouse_hide_wait      2
enable_audio_bell    no
copy_on_select       yes
strip_trailing_spaces smart
cursor_shape         block
cursor_blink_interval 0
cursor_trail         0

# Tabs -----------------------------------------------------------------------
tab_bar_style    hidden
tab_powerline_style slanted

# Wallpaper-generated dark surface and primary accents (Matugen).
include colors.conf

# Keep the shell's generated effects and launch Zsh when it is installed.
globinclude rice-flat.conf
shell /bin/sh -c 'if command -v zsh >/dev/null 2>&1; then ZDOTDIR="$HOME/.config/zsh" exec zsh; else exec /bin/bash; fi'
