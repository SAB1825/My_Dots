# Enable True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -gq allow-passthrough on

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set-option -g prefix '`'
set-option -g prefix2 none
bind-key '`' send-prefix
set -g extended-keys on
set -g extended-keys-format csi-u

set -g detach-on-destroy off

# Utility bindings
unbind r
bind r source-file ~/.config/tmux/tmux.conf

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind v
bind v copy-mode

# resizing panes with hjkl
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# maximize panes
bind -r m resize-pane -Z

# disable kill accept prompt
bind x kill-pane

# mouse support
set -g mouse on

# vim shell navigations and selects in tmux panes
set-window-option -g mode-keys vi
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-selection

# Sesh keybinds
# sesh w/ gum dir selector
bind "T" display-popup -E -w 40% "sesh connect \"$(
    sesh list -i | gum filter --no-strip-ansi --limit 1 --placeholder 'Pick session' --prompt='🛸 '
)\""

# sesh w/ (tmux fzf)
bind "K" run-shell "sesh connect \"$(
        sesh list --icons | fzf-tmux -p 90%,80% \
        --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
        --header '🔑 ^a all | ^t tmux | ^g conf | ^x zoxide | ^d tmux kill | ^f find' \
        --bind 'tab:down,btab:up' \
        --bind 'ctrl-a:change-prompt(🛸  )+reload(sesh list --icons)' \
        --bind 'ctrl-t:change-prompt(◧  )+reload(sesh list -t --icons)' \
        --bind 'ctrl-g:change-prompt(⛯  )+reload(sesh list -c --icons)' \
        --bind 'ctrl-x:change-prompt(🗃  )+reload(sesh list -z --icons)' \
        --bind 'ctrl-f:change-prompt(🔭  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
        --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(👽  )+reload(sesh list --icons)' \
        --preview-window 'right:45%' \
        --preview 'sesh preview {}'
)\""

# tmux goodies
bind -r f run-shell "tmux neww ~/scripts/tmux-sessionizer.sh"
bind n command-prompt "new-session -s '%%'"

# tmux display popups
bind C-y display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "yazi" # yazi float
bind C-t display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "zsh" # quick floating terminal
bind C-g display-popup -d "#{pane-current-path}" -w 90% -h 90% -E "lazygit" # lazygit float
bind C-m display-popup -w 95% -h 95% -E "rmpc" # music float
bind d detach-client
bind D display-menu -T "#[align=centre]Config" -x C -y C \
    ".zshrc"            z  "display-popup -w 85% -h 85% -E 'nvim ~/.zshrc'" \
    ".zprofile"         p  "display-popup -w 85% -h 85% -E 'nvim ~/.zprofile'" \
    "tmux.conf"         t  "display-popup -w 85% -h 85% -E 'nvim ~/dotfiles/tmux/.config/tmux/tmux.conf'" \
    ".nvim"             v  "display-popup -w 95% -h 95% -d "~/dotfiles/nvim/.config/nvim" -E 'nvim ~/dotfiles/nvim/.config/nvim'" \
    "quit"              q  ""

# Drag copy using mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# tmux plugin manager 
set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.config/tmux/.tmux/plugins
set -g @plugin 'tmux-plugins/tpm' # must be the first plugin
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin 'omerxx/tmux-sessionx' # default keybind "<prefix> O" to activate
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# resurrect
set -g @resurrect-capture-pane-contents 'on'
# continuum save every 15 min and restore on tmux server start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

set -g @sessionx-bind 'o'
set -g @sessionx-git-branch 'on'
set -g @sessionx-preview-location 'top'
set -g @sessionx-preview-ratio '53%'

# Read the wallpaper palette generated by Quickshell/Matugen.
run-shell 'python3 ~/.config/tmux/scripts/matugen-theme.py'

# NOTE: status left look and feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#[bg=#{?client_prefix,#{@palette_error},#{@palette_bg}},fg=#{?client_prefix,#{@palette_bg},#{@palette_accent}},#{?client_prefix,bold,none}]  #S#{?#{||:#{==:#{pane_current_path},$HOME},#{==:#{pane_current_path},#{session_path}}},,: #{s|.*/([^/]+/[^/]+)|\\1|:#{s|^$HOME|~|:pane_current_path}}} "

#gitmux
set -ga status-left "#[bg=#{@palette_bg}]#(cd '#{pane_current_path}' && git rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's/^/#[fg=#{@palette_muted}]│#[fg=#{@palette_accent_alt}] 󰊢 /; s/$/ /')"

set -ga status-left "#[bg=#{@palette_bg},fg=#{@palette_muted},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@palette_bg},fg=#{@palette_accent_alt}]#{?window_zoomed_flag,  zoom ,}"

# Display only the time; the silent command refreshes wallpaper colors.
set -g status-right-length 20
set -g status-right "#(python3 ~/.config/tmux/scripts/matugen-theme.py)#[bg=#{@palette_bg},fg=#{@palette_accent}] %H:%M "
set -g status-interval 5

# Configure Tmux
set -g status-position bottom
set -g status-style "bg=#{@palette_bg},fg=#{@palette_fg}"
set -g status-justify "absolute-centre"

# Pane borders and selection follow the wallpaper palette.
set -g pane-border-style "fg=#{@palette_surface}"
set -g pane-active-border-style "fg=#{@palette_accent}"
set -g message-style "bg=#{@palette_surface},fg=#{@palette_fg}"
set -g mode-style "bg=#{@palette_accent},fg=#{@palette_accent_text}"

# pane border look and feel

# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=#{@palette_bg},fg=#{@palette_muted}"
set -g window-status-last-style "bg=#{@palette_bg},fg=#{@palette_fg_dim}"

set -g window-status-activity-style "bg=#{@palette_error},fg=#{@palette_bg}"
set -g window-status-bell-style "bg=#{@palette_error},fg=#{@palette_bg},bold"
set -g window-status-separator "#[bg=#{@palette_bg},fg=#{@palette_muted}]│"

set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=#{@palette_accent},fg=#{@palette_accent_text},bold"

run '~/.config/tmux/.tmux/plugins/tpm/tpm' # always keep this line last
